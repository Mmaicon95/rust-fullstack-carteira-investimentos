name: Rust CI (Apex Carteira)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-box: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: apex_carteira
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache de Dependências
      uses: swatinem/rust-cache@v2

    - name: Executar Migrações e Testes do Rust
      run: |
        cargo install sqlx-cli --no-default-features --features postgres
        sqlx migrate run
        cargo test
      env:
        DATABASE_URL: postgres://postgres:password123@localhost:5432/apex_carteira
